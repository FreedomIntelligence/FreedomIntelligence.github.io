            url: "https://aclanthology.org/2025.naacl-long.256/"
            venue: "NAACL 2025"
            note: "Evaluates multimodal LLMs with per-sample criteria that become the judge's core input."
            note_zh: "用 per-sample criteria 评估多模态大模型，让样本级标准成为评审的核心输入。"
