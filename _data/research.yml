            url: "/blog/2026/foundation-models-to-embodied-ai/en/#scene-loop"
            url_zh: "/blog/2026/foundation-models-to-embodied-ai/#scene-loop"
          - title: "From improving the model to improving the whole robot"
            title_zh: "从改进模型，走向改进整个机器人"
            url: "/blog/2026/foundation-models-to-embodied-ai/en/#coevolution"
