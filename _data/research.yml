        kicker_zh: "高效训练、推理、检索与多模态上下文"
        summary: "This line asks a practical question, can we afford to run it, train it, and update it quickly, and answers with reasoning-path pruning, question-free fine-tuning, prefix fine-tuning, editable efficient RAG, long-context multimodality, and token reduction."
        summary_zh: "这条线把“能不能跑得起、训得动、改得快”作为项目主题，覆盖推理路径剪枝、question-free fine-tuning、前缀微调、可编辑的高效 RAG、长上下文多模态和 token 压缩。"
        page: "/projects/llm-efficiency-ai-infra/"
        links:
          - {label: "LongLLaVA & MileBench", label_zh: "LongLLaVA 与 MileBench", url: "/projects/long-context-multimodal/"}
          - {label: "Data infrastructure", label_zh: "数据基础设施", url: "/projects/rag-instruction-data/"}
        highlights: ["STOP", "QFFT", "UPFT", "E2-RAG", "TRIM"]
        image: "/assets/img/research/llm-efficiency.svg"
        image_zh: "/assets/img/research/llm-efficiency-zh.svg"
        image_alt: "Diagram of four efficiency levers: prune reasoning paths, tune with less supervision, edit compressed KV caches, and use fewer visual tokens"
        image_alt_zh: "示意图：四种效率手段——剪枝推理路径、用更少监督微调、编辑压缩 KV cache、减少视觉 token"
        papers:
          - title: "Cut Your Losses! Learning to Prune Paths Early for Efficient Parallel Reasoning"
            url: "https://arxiv.org/abs/2604.16029"
            note: "Prunes low-value reasoning paths early."
            note_zh: "提前剪枝低价值推理路径。"
          - title: "Question-Free Fine-Tuning: Towards Efficient and Adaptive Reasoning in Large Language Models"
            url: "https://arxiv.org/abs/2506.12860"
            note: "QFFT for efficient, adaptive reasoning."
            note_zh: "面向高效自适应推理的 QFFT。"
          - title: "The First Few Tokens Are All You Need"
            url: "https://arxiv.org/abs/2503.02875"
            note: "UPFT: efficient unsupervised reasoning fine-tuning on only a few prefix tokens."
            note_zh: "UPFT，用极少前缀 token 进行高效无监督推理微调。"
          - title: "E2-RAG: Towards Editable Efficient RAG by Editing Compressed KV Caches"
            url: "https://papers.cool/venue/COLM.2025"
            venue: "COLM 2025"
            note: "Edits compressed KV caches for knowledge that changes fast."
            note_zh: "编辑压缩 KV cache，面向快速更新场景。"
          - title: "LongLLaVA: Scaling Multi-modal LLMs to 1000 Images Efficiently"
            url: "https://arxiv.org/abs/2409.02889"
            note: "Long-context multi-image multimodal reasoning."
            note_zh: "长上下文多图像多模态推理。"
          - title: "TRIM: Less is More for Efficient Multi-modal LLMs"
            url: "https://arxiv.org/abs/2409.10994"
            note: "Fewer visual tokens, lower multimodal inference cost."
            note_zh: "减少视觉 token，降低多模态推理成本。"
        resources:
          - {type: "Project", name: "China-Developed AI Computing", url: "/projects/native-ai-compute-adaptation/", note: "Ascend training, full-stack acceleration, benchmark validation, real-world delivery, and open ecosystem building.", note_zh: "昇腾大规模训练、全栈计算加速、Benchmark 验证、真实场景交付与开放生态。"}
          - {type: "GitHub", name: "FreedomIntelligence/LongLLaVA", url: "https://github.com/FreedomIntelligence/LongLLaVA", note: "Long-context multimodal model.", note_zh: "长上下文多模态模型。"}
          - {type: "GitHub", name: "FreedomIntelligence/TRIM", url: "https://github.com/FreedomIntelligence/TRIM", note: "Efficient multimodal token reduction.", note_zh: "高效多模态 token 压缩。"}
          - {type: "GitHub", name: "1KE-JI/UPFT", url: "https://github.com/1KE-JI/UPFT", note: "Unsupervised prefix fine-tuning resources.", note_zh: "无监督前缀微调资源。"}
          - {type: "GitHub", name: "FreedomIntelligence/RAG-Instruct", url: "https://github.com/FreedomIntelligence/RAG-Instruct", note: "Retrieval-augmented instruction data.", note_zh: "检索增强指令数据。"}
          - {type: "GitHub", name: "FreedomIntelligence/LLMZoo", url: "https://github.com/FreedomIntelligence/LLMZoo", note: "Open models and training resources.", note_zh: "开放模型和训练资源集合。"}

