# -----------------------------------------------------------------------------
# Freedom AI research map: the single source of truth for the six research
# directions and the programs inside them.
#
# Used by:
#   /projects/            _pages/reading.md         (full map, papers, resources)
#   /                     _pages/about.md           (Research Directions cards)
#   every page            _includes/footer.html     (direction links)
#   /projects/<name>/     _layouts/page.html        (breadcrumb, "more in")
#
# One taxonomy for the whole site. The direction and program ids below are the
# tags everywhere else:
#   _projects/*.md        direction: <direction id>
#   papers.bib            tags={<program or direction id>; ...}  -> /publications/ filters
#   _posts/*.md           research: [<program or direction id>, ...] -> /blog/ filters
# A program id implies its direction, so tag with the most specific id.
#
# Edit here and every page stays in sync. Anchors: /projects/#<direction id>
# opens a direction, /projects/#<topic id> scrolls to and expands a program.
# Keep ids stable: they are linked from other pages and external sites.
#
# Topic fields
#   id, title, title_zh, short, short_zh    names (short = chip label)
#   icon                                     icon name, a key of _data/icons.yml
#   kicker, kicker_zh, summary, summary_zh   one-line focus and description
#   page                                     detail page (primary button)
#   links                                    extra buttons {label, label_zh, url, url_zh}
#   highlights, highlights_zh                project names shown on the card (zh optional)
#   image, image_zh, image_alt, image_alt_zh figure shown when expanded
#   papers                                   {title, url, venue, note, note_zh}
#   steps                                    program items instead of papers
#                                            {title, title_zh, url, note, note_zh}
#   list_title, list_title_zh                heading above papers or steps
#   resources                                {type, name, url, venue, note, note_zh}
#                                            type is a key of `types` below
# -----------------------------------------------------------------------------

types:
  GitHub: {icon: github, en: "GitHub", zh: "GitHub", open: true}
  HF Model: {icon: huggingface, en: "Hugging Face model", zh: "Hugging Face 模型", open: true}
  HF Dataset: {icon: huggingface, en: "Hugging Face dataset", zh: "Hugging Face 数据集", open: true}
  Project: {icon: app-window, en: "Project", zh: "项目"}
  Paper: {icon: file-text, en: "Paper", zh: "论文"}
  Platform: {icon: monitor, en: "Platform", zh: "平台"}
  Challenge: {icon: trophy, en: "Challenge", zh: "挑战赛"}
  Essay: {icon: pen-line, en: "Essay", zh: "文章"}
  News: {icon: newspaper, en: "News", zh: "新闻"}

directions:

  # ---------------------------------------------------------------------------
  - id: agentic-ai
    name: "Agentic AI"
    name_zh: "智能体 AI"
    icon: brain-circuit
    tagline: "Reasoning, learning, tool use, and interactive environments."
    tagline_zh: "推理、强化学习、工具使用与交互环境。"
    topics:

      - id: llm-reasoning-agentic-rl
        title: "LLM Reasoning & Agentic RL"
        title_zh: "大模型推理与智能体强化学习"
        short: "Reasoning & RL"
        short_zh: "推理与强化学习"
        icon: route
        kicker: "Reasoning, RL, and adaptive test-time compute"
        kicker_zh: "推理、强化学习与自适应测试时计算"
        summary: "This project organizes the lab's recent work on verifiable reasoning, policy optimization, path pruning, code-integrated thinking, and multimodal R1-style training. The through-line is simple: make LLMs reason with feedback signals that are inspectable, efficient, and useful for downstream agents."
        summary_zh: "这一方向整合实验室在可验证推理、策略优化、推理路径剪枝、代码集成思考和多模态 R1 式训练上的近期工作。主线很简单：让大模型借助可检查、高效、且对下游智能体有用的反馈信号进行推理。"
        page: "/projects/llm-reasoning-agentic-rl/"
        links:
          - {label: "Math & Optimization", label_zh: "数学与运筹优化", url: "/projects/reasoning-math-optimization/"}
          - {label: "Papers by Benyou Wang", label_zh: "王本友论文列表", url: "https://wabyking.github.io/"}
        highlights: ["OnePO", "CRPO", "STOP", "Video-R1", "CoRT"]
        image: "/assets/img/research/reasoning-agentic-rl.svg"
        image_zh: "/assets/img/research/reasoning-agentic-rl-zh.svg"
        image_alt: "Diagram of the reasoning and agentic RL program: policy optimization, efficient reasoning, code-integrated thinking, and multimodal R1 training around verifiable feedback"
        image_alt_zh: "推理与智能体强化学习路线示意：围绕可验证反馈的策略优化、高效推理、代码集成思考与多模态 R1 训练"
        papers:
          - title: "OnePO: Direct One-stage Policy Optimization for SFT-free Domain Adaptation"
            url: "https://wabyking.github.io/"
            note: "Direct policy optimization without a separate SFT stage."
            note_zh: "无需单独 SFT 阶段的直接策略优化。"
          - title: "CRPO: Character-centric Group Relative Policy Optimization for Role-aware Reasoning in Role-playing Agents"
            url: "https://arxiv.org/abs/2605.25511"
            note: "RL objectives for role-aware reasoning agents."
            note_zh: "面向角色感知推理智能体的强化学习目标。"
          - title: "Question-Free Fine-Tuning: Towards Efficient and Adaptive Reasoning in Large Language Models"
            url: "https://arxiv.org/abs/2506.12860"
            note: "Efficient and adaptive reasoning fine-tuning."
            note_zh: "高效、自适应的推理微调。"
          - title: "Cut Your Losses! Learning to Prune Paths Early for Efficient Parallel Reasoning"
            url: "https://arxiv.org/abs/2604.16029"
            note: "Learnable path pruning for large reasoning models."
            note_zh: "面向大推理模型的可学习路径剪枝。"
          - title: "Video-R1: Reinforcing Video Reasoning in MLLMs"
            url: "https://arxiv.org/abs/2503.21776"
            note: "R1-style reinforcement learning for multimodal video reasoning."
            note_zh: "把 R1 式强化学习用于多模态视频推理。"
          - title: "CoRT: Code-integrated Reasoning within Thinking"
            url: "https://arxiv.org/abs/2506.09820"
            note: "Executable computation inside the reasoning process."
            note_zh: "在推理过程中嵌入可执行计算。"
        resources:
          - {type: "Project", name: "STOP / Cut Your Losses", url: "https://bijiaxihh.github.io/STOP/", note: "Early path pruning for efficient parallel reasoning.", note_zh: "提前剪枝推理路径，实现高效并行推理。"}
          - {type: "GitHub", name: "tulerfeng/Video-R1", url: "https://github.com/tulerfeng/Video-R1", note: "Video-R1-CoT and RL training resources for video reasoning.", note_zh: "视频推理的 Video-R1-CoT 数据与强化学习训练资源。"}
          - {type: "GitHub", name: "ChengpengLi1003/CoRT", url: "https://github.com/ChengpengLi1003/CoRT", note: "Code-integrated reasoning resources.", note_zh: "代码集成推理资源。"}
          - {type: "GitHub", name: "1KE-JI/UPFT", url: "https://github.com/1KE-JI/UPFT", note: "Unsupervised prefix fine-tuning for efficient reasoning models.", note_zh: "面向高效推理模型的无监督前缀微调。"}

      - id: llm-agents-applications
        title: "LLM Agents, Applications & Human-Agent Interaction"
        title_zh: "大模型智能体、应用与人机交互"
        short: "Agent Applications"
        short_zh: "智能体应用"
        icon: users
        kicker: "Agents, applications, simulators, and human-agent interaction"
        kicker_zh: "智能体、应用、模拟器与人机交互"
        summary: "This project groups papers where LLMs become agents and interactive systems: tool planners, user simulators, standardized patients, role-playing agents, market participants, speech-to-speech systems, and micro-world actors. Papers are organized by what the agent does, where it acts, how it interacts with humans, and how the interaction is evaluated."
        summary_zh: "这一方向汇集让大模型成为智能体与交互系统的工作：工具规划器、用户模拟器、标准化病人、角色扮演智能体、市场参与者、语音对话系统和微观世界中的行动者。我们按照智能体做什么、在什么环境中行动、如何与人交互、以及交互如何被评测来组织这些论文。"
        page: "/projects/llm-agents-applications/"
        links:
          - {label: "Human-agent interaction", label_zh: "人机交互详情", url: "/projects/human-agent-interaction/"}
          - {label: "Papers by Benyou Wang", label_zh: "王本友论文列表", url: "https://wabyking.github.io/"}
        highlights: ["Smurfs", "PlatoLM", "EasyMED", "TwinMarket", "MicroVerse"]
        image: "/assets/img/media-roundup-2026/twinmarket-bdi.png"
        image_alt: "TwinMarket belief-desire-intention framework for LLM investor agents"
        image_alt_zh: "TwinMarket 中大模型投资者智能体的信念—愿望—意图框架"
        papers:
          - title: "Smurfs: Multi-Agent System using Context-Efficient DFSDT for Tool Planning"
            url: "https://aclanthology.org/2025.naacl-long.169/"
            venue: "NAACL 2025"
            note: "Multi-agent tool planning with context-efficient search."
            note_zh: "基于上下文高效搜索的多智能体工具规划。"
          - title: "Large Language Model as a User Simulator"
            url: "https://arxiv.org/abs/2308.11534"
            note: "LLM users for dialogue training and evaluation."
            note_zh: "用大模型扮演用户，支持对话训练与评测。"
          - title: "PlatoLM: Teaching LLMs via a Socratic Questioning User Simulator"
            url: "https://openreview.net/forum?id=9nddtu94uX"
            note: "Socratic interaction as a training signal."
            note_zh: "把苏格拉底式追问作为训练信号。"
          - title: "Human or LLM as Standardized Patients? A Comparative Study in Medical Education"
            url: "https://arxiv.org/abs/2511.14783"
            note: "AI patients for medical education and evaluation."
            note_zh: "用于医学教育与评测的 AI 病人。"
          - title: "Human or Machine? A Preliminary Turing Test for Speech-to-Speech Interaction"
            url: "https://arxiv.org/abs/2602.24080"
            note: "Human-likeness evaluation for speech-to-speech interaction."
            note_zh: "评测语音到语音交互的拟人程度。"
          - title: "TwinMarket: A Scalable Behavioral and Social Simulation for Financial Markets"
            url: "https://arxiv.org/abs/2502.01506"
            note: "LLM investor agents in market simulation."
            note_zh: "金融市场仿真中的大模型投资者智能体。"
          - title: "MicroVerse: A Preliminary Exploration Toward a Micro-World Simulation"
            url: "https://arxiv.org/abs/2603.00585"
            note: "Agentic micro-world simulation for scientific processes."
            note_zh: "面向科学过程的智能体微观世界仿真。"
        resources:
          - {type: "Paper", name: "Smurfs", url: "https://arxiv.org/abs/2405.05955", note: "Multi-agent tool planning through context-efficient DFSDT.", note_zh: "基于上下文高效 DFSDT 的多智能体工具规划。"}
          - {type: "GitHub", name: "FreedomIntelligence/EasyMED", url: "https://github.com/FreedomIntelligence/EasyMED", note: "AI standardized patient framework and evaluation resources.", note_zh: "AI 标准化病人框架与评测资源。"}
          - {type: "Project", name: "TwinMarket", url: "/projects/twinmarket-financial-simulation/", note: "Financial market simulation with LLM agents.", note_zh: "基于大模型智能体的金融市场仿真。"}
          - {type: "Project", name: "MicroVerse", url: "/projects/microverse-world-simulation/", note: "Micro-world simulation with hidden mechanisms and evolving states.", note_zh: "具有隐藏机制与状态演化的微观世界仿真。"}

      - id: mobile-agent
        title: "Mobile Agent"
        title_zh: "手机智能体"
        short: "Mobile Agent"
        short_zh: "手机智能体"
        icon: smartphone
        kicker: "Phone-use agents and mobile workflow execution"
        kicker_zh: "手机使用智能体与移动端工作流执行"
        summary: "This line turns the phone into a real execution ground for general-purpose agents: from privacy and safety evaluation, to controllable phone environments and a mixed GUI, CLI, and tool-action harness, to open models trained on real app workflows, so that phone-use agents complete tasks reliably, safely, and auditably."
        summary_zh: "这条线把手机变成通用智能体的真实执行场：从隐私与安全评测，到可控手机环境、GUI / CLI / tool 混合动作的 harness，再到面向真实 App 工作流训练的开放模型，让手机智能体能可靠、安全、可审计地完成任务。"
        page: "/projects/mobile-agent/"
        links:
          - {label: "PhoneHarness", label_zh: "PhoneHarness 主页", url: "https://phoneharness.github.io/"}
          - {label: "PhoneHarness Bench", label_zh: "PhoneHarness 数据集", url: "https://huggingface.co/datasets/PhoneHarness/phoneharness-bench"}
        highlights: ["MyPhoneBench", "PhoneWorld", "PhoneHarness", "PhoneBuddy"]
        image: "/assets/img/media-roundup-2026/phoneharness-overview.png"
        image_alt: "PhoneHarness overview: phone-use agents with mixed GUI, CLI, and tool actions"
        image_alt_zh: "PhoneHarness 概览：结合 GUI、CLI 与工具动作的手机智能体"
        papers:
          - title: "Do Phone-Use Agents Respect Your Privacy?"
            url: "https://arxiv.org/abs/2604.00986"
            note: "MyPhoneBench evaluates permission, disclosure, and memory-control risks of phone-use agents."
            note_zh: "用 MyPhoneBench 评测手机智能体的权限、披露和记忆控制风险。"
          - title: "Safe, or Simply Incapable?"
            url: "https://arxiv.org/abs/2605.07630"
            note: "Separates genuine safety from dangerous actions and from agents that simply cannot do the task."
            note_zh: "区分真正安全、危险行动和“什么也做不好”的失败。"
          - title: "PhoneWorld"
            url: "https://arxiv.org/abs/2605.29486"
            note: "Turns real GUI trajectories and screenshots into reusable, executable, verifiable phone environments."
            note_zh: "把真实 GUI 轨迹和截图转成可复用、可执行、可验证的手机环境。"
          - title: "PhoneHarness"
            url: "https://arxiv.org/abs/2606.14832"
            note: "Measures real phone-workflow completion with a mixed action space of GUI, CLI, and tool actions."
            note_zh: "用 GUI、CLI 和 tool action 的混合动作空间评测真实手机工作流完成度。"
          - title: "PhoneBuddy"
            url: "https://arxiv.org/abs/2606.23049"
            note: "Trains open phone-use agent models with real app environments and a mock phone environment."
            note_zh: "结合真实 App 环境和模拟手机环境训练开放的手机智能体模型。"
        resources:
          - {type: "Project", name: "Mobile Agent", url: "/projects/mobile-agent/", note: "Evaluation, safety, environments, harness, and training for phone agents.", note_zh: "手机智能体的评测、安全、环境、harness 和训练路线总览。"}
          - {type: "Project", name: "PhoneHarness", url: "https://phoneharness.github.io/", note: "Project page for phone agents with mixed GUI, CLI, and tool actions.", note_zh: "GUI、CLI 与 tool 混合动作的手机智能体项目主页。"}
          - {type: "GitHub", name: "PhoneHarness/PhoneHarness", url: "https://github.com/PhoneHarness/PhoneHarness", note: "Phone-use agent harness and evaluation workflow code.", note_zh: "手机智能体 harness 与评测工作流代码。"}
          - {type: "HF Dataset", name: "PhoneHarness Bench", url: "https://huggingface.co/datasets/PhoneHarness/phoneharness-bench", note: "Mixed-action benchmark data for phone agents.", note_zh: "手机智能体混合动作 benchmark 数据。"}

      - id: agentic-creation-executable-artifacts
        title: "Agentic Creation & Executable Artifacts"
        title_zh: "智能体创作与可执行产物"
        short: "Agentic Creation"
        short_zh: "智能体创作"
        icon: code-xml
        kicker: "From instructions to runnable games, CAD scripts, solvers, and code"
        kicker_zh: "从指令到可运行的游戏、CAD 脚本、求解器与代码"
        summary: "This line asks not whether a model sounds right, but whether an agent can turn a natural-language request into an artifact that actually runs, renders, and can be verified: playable Godot games, executable Blender CAD scripts, and mathematical-modeling solvers, with reasoning connected to a code-execution environment."
        summary_zh: "这条线关注的不是“模型说得像不像”，而是智能体能不能把自然语言需求变成真正可运行、可渲染、可验证的产物。代表任务包括生成可玩的 Godot 游戏、可执行的 Blender CAD 脚本、数学建模求解器，以及把推理过程接到代码执行环境中。"
        page: "/projects/agentic-creation-executable-artifacts/"
        links:
          - {label: "GameCraft-Bench", label_zh: "GameCraft-Bench", url: "https://github.com/FreedomIntelligence/gamecraft-bench"}
          - {label: "BlenderLLM", label_zh: "BlenderLLM", url: "https://github.com/FreedomIntelligence/BlenderLLM"}
        highlights: ["GameCraft-Bench", "BlenderLLM", "Mamo", "ORLM", "CoRT"]
        image: "/assets/img/research/agentic-creation.svg"
        image_zh: "/assets/img/research/agentic-creation-zh.svg"
        image_alt: "Diagram: an instruction becomes an executable artifact that is run and verified, with games, CAD scripts, solvers, and code as examples"
        image_alt_zh: "示意图：指令被智能体转为可执行产物并运行验证，例子包括游戏、CAD 脚本、求解器与代码"
        papers:
          - title: "GameCraft-Bench"
            url: "https://arxiv.org/abs/2606.17861"
            note: "Tests whether coding agents can turn a game spec into a complete Godot project that launches and replays."
            note_zh: "评估 coding agents 是否能把游戏规格生成完整、可启动、可 replay 的 Godot 项目。"
          - title: "BlenderLLM"
            url: "https://arxiv.org/abs/2412.14203"
            note: "Trains LLMs to write CAD scripts that execute in Blender and render 3D models."
            note_zh: "训练大模型生成可在 Blender 中执行并渲染 3D 模型的 CAD 脚本。"
          - title: "Mamo"
            url: "https://arxiv.org/abs/2405.13144"
            note: "A mathematical-modeling benchmark with solvers that turn natural-language problems into solvable models."
            note_zh: "面向数学建模的 benchmark 和求解器，把自然语言问题转成可求解模型。"
          - title: "ORLM"
            url: "https://arxiv.org/abs/2405.17743"
            note: "Trains LLMs for automated optimization modeling, linking descriptions, constraints, objectives, and code."
            note_zh: "训练大模型做自动化优化建模，连接问题描述、约束、目标函数和代码。"
          - title: "CoRT"
            url: "https://arxiv.org/abs/2506.09820"
            note: "Puts code execution inside reasoning so intermediate computation can be verified."
            note_zh: "把代码执行放进推理，提升中间计算的可验证性。"
        resources:
          - {type: "Project", name: "Agentic Creation", url: "/projects/agentic-creation-executable-artifacts/", note: "Executable-artifact generation, verification, and interactive evaluation.", note_zh: "可执行产物生成、验证和交互式评测总览。"}
          - {type: "GitHub", name: "FreedomIntelligence/gamecraft-bench", url: "https://github.com/FreedomIntelligence/gamecraft-bench", note: "Playable-game generation benchmark with tasks, replays, and hidden rubrics.", note_zh: "可玩游戏生成 benchmark、任务、replay 和 hidden rubric。"}
          - {type: "GitHub", name: "FreedomIntelligence/BlenderLLM", url: "https://github.com/FreedomIntelligence/BlenderLLM", note: "CAD-script generation model, BlendNet data, and CADBench.", note_zh: "CAD 脚本生成模型、BlendNet 数据和 CADBench。"}
          - {type: "GitHub", name: "FreedomIntelligence/Mamo", url: "https://github.com/FreedomIntelligence/Mamo", note: "Mathematical-modeling benchmark and solver resources.", note_zh: "数学建模 benchmark 与求解器资源。"}
          - {type: "GitHub", name: "Cardinal-Operations/ORLM", url: "https://github.com/Cardinal-Operations/ORLM", note: "Automated optimization-modeling training framework and the IndustryOR benchmark.", note_zh: "自动化优化建模训练框架和 IndustryOR benchmark。"}

      - id: environment-engineering-world-models
        title: "Environment Engineering & World Models"
        title_zh: "环境工程和世界模型"
        short: "World Models"
        short_zh: "环境与世界模型"
        icon: earth
        kicker: "States, actions, users, rules, and world dynamics"
        kicker_zh: "状态、行动、用户、规则与世界动力学"
        summary: "This line puts model capability inside runnable environments: defining states, actions, tools, users, rules, world dynamics, and evaluation alignment, so agents can be trained, evaluated, and iterated in user simulations, financial markets, scientific micro-worlds, and executable optimization environments."
        summary_zh: "这条线把“模型能力”放进可运行环境中：定义状态、行动、工具、用户、规则、世界动力学和评测对齐，让智能体能在用户模拟、金融市场、科学微世界和可执行优化环境中训练、评测和迭代。"
        page: "/projects/environment-engineering-world-models/"
        links:
          - {label: "Papers by Benyou Wang", label_zh: "王本友论文列表", url: "https://wabyking.github.io/"}
        highlights: ["MicroVerse", "TwinMarket", "Economic World Models", "User Simulator", "CALM/STORM"]
        highlights_zh: ["MicroVerse", "TwinMarket", "经济世界模型", "用户模拟器", "CALM/STORM"]
        image: "/assets/img/economic-world-models/ewm-hero.png"
        image_alt: "Environment engineering connects agents, environments, co-evolution, and real-world alignment"
        image_alt_zh: "环境工程连接智能体、环境、共演化与真实世界对齐"
        papers:
          - title: "MicroVerse: A Preliminary Exploration Toward a Micro-World Simulation"
            url: "https://arxiv.org/abs/2603.00585"
            note: "Extends world models to organ, cell, and subcellular processes, with hidden mechanisms, state evolution, and scientific constraints."
            note_zh: "把世界模型扩展到器官、细胞和亚细胞过程，强调隐藏机制、状态演化和科学约束。"
          - title: "TwinMarket: A Scalable Behavioral and Social Simulation for Financial Markets"
            url: "https://arxiv.org/abs/2502.01506"
            note: "A financial-market environment built from LLM investors, where macro behavior emerges from beliefs and information flow."
            note_zh: "用大模型投资者构造金融市场环境，从个体信念和信息流生成宏观行为。"
          - title: "From Economic Agents to Agentic Economies"
            url: "/assets/pdf/economic-world-models.pdf"
            note: "A system blueprint for economic world models: agents, environments, co-evolution, and real-world alignment."
            note_zh: "把智能体、环境、共演化和真实世界对齐组织成经济世界模型的系统蓝图。"
          - title: "Large Language Model as a User Simulator"
            url: "https://arxiv.org/abs/2308.11534"
            note: "Controllable user environments that give multi-turn dialogue training and evaluation a repeatable counterpart."
            note_zh: "用大模型构造可控用户环境，为多轮对话训练和评测提供可重复交互对象。"
          - title: "ORLM: A Customizable Framework in Training Large Models for Automated Optimization Modeling"
            url: "https://arxiv.org/abs/2405.17743"
            note: "Turns natural-language problems into optimization models, constraints, objectives, and executable code."
