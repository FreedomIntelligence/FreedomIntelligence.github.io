            url: "/blog/2026/foundation-models-to-embodied-ai/en/#practice"
            url_zh: "/blog/2026/foundation-models-to-embodied-ai/#practice"
        resources:
          - {type: "Essay", name: "From Foundation Models to Embodied AI (English)", url: "/blog/2026/foundation-models-to-embodied-ai/en/", note: "Research overview with demonstrations of spatial environments, simulation, robot control, and on-device systems.", note_zh: "英文版：空间环境、仿真、机器人控制与端侧系统的研究综述与演示。"}
