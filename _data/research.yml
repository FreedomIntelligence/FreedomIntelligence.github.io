      - id: optimization-llms
        title: "Optimization Modeling LLMs"
        title_zh: "运筹优化大模型系列"
        short: "Optimization"
        short_zh: "运筹优化"
        icon: sigma
        kicker: "From natural-language problems to solvable models"
        kicker_zh: "从自然语言问题到可求解模型"
        summary: "Our operations-research line turns natural-language problems into mathematical optimization models, constraints, objectives, and executable code. ORLM provides open models and the IndustryOR benchmark; CALM and STORM go further into native reasoning for optimization modeling."
        summary_zh: "运筹优化主线把自然语言问题转成数学优化模型、约束、目标函数和可执行代码。ORLM 提供开放模型与 IndustryOR benchmark，CALM / STORM 进一步研究优化建模中的原生推理能力。"
        page: "/projects/reasoning-math-optimization/"
        highlights: ["ORLM", "IndustryOR", "CALM / STORM", "MathScale"]
        image: "/assets/img/research/optimization-modeling.svg"
        image_zh: "/assets/img/research/optimization-modeling-zh.svg"
        image_alt: "Diagram: a natural-language problem becomes variables, constraints, and an objective, then solver code and a verified solution"
        image_alt_zh: "示意图：自然语言问题转为变量、约束与目标函数，再生成求解代码并得到可验证的解"
        papers:
          - title: "ORLM: A Customizable Framework in Training Large Models for Automated Optimization Modeling"
            url: "https://arxiv.org/abs/2405.17743"
            note: "OR-Instruct, ORLM, and IndustryOR."
            note_zh: "OR-Instruct、ORLM 和 IndustryOR。"
          - title: "CALM Before the STORM: Unlocking Native Reasoning for Optimization Modeling"
            url: "https://arxiv.org/abs/2510.04204"
            note: "Native reasoning for optimization modeling."
            note_zh: "优化建模中的原生推理。"
          - title: "MathScale: Scaling Instruction Tuning for Mathematical Reasoning"
            url: "https://arxiv.org/abs/2403.02884"
            note: "Foundations for scaling math reasoning and verifiers."
            note_zh: "数学推理 scaling 与 verifier 相关基础。"
          - title: "CoRT: Code-integrated Reasoning within Thinking"
            url: "https://arxiv.org/abs/2506.09820"
            note: "Brings code execution into the chain of thought, which also serves formal modeling and computation."
            note_zh: "将代码执行接入思维链，也服务于形式化建模和计算。"
        resources:
          - {type: "GitHub", name: "Cardinal-Operations/ORLM", url: "https://github.com/Cardinal-Operations/ORLM", note: "Training framework, data synthesis, and benchmarks for automated optimization modeling.", note_zh: "自动化优化建模训练框架、数据合成和 benchmark 入口。"}
          - {type: "HF Dataset", name: "CardinalOperations/IndustryOR", url: "https://huggingface.co/datasets/CardinalOperations/IndustryOR", note: "Benchmark of 100 real industrial operations-research problems.", note_zh: "100 个真实工业运筹问题 benchmark。"}
          - {type: "GitHub", name: "tangzhy/STORM", url: "https://github.com/tangzhy/STORM", note: "CALM/STORM resources for optimization-modeling reasoning.", note_zh: "CALM/STORM 优化建模推理资源。"}
          - {type: "GitHub", name: "ChengpengLi1003/CoRT", url: "https://github.com/ChengpengLi1003/CoRT", note: "Code-integrated reasoning resources.", note_zh: "代码集成推理资源。"}

