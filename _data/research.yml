      - id: medical-evaluation
        title: "Medical AI Evaluation"
        title_zh: "医疗 AI 评测系列"
        short: "Medical Evaluation"
        short_zh: "医疗评测"
        icon: clipboard-plus
        kicker: "From medical knowledge to live clinical tasks"
        kicker_zh: "从医学知识到真实临床任务"
        summary: "Medical AI cannot be judged by fluent chat alone. This line breaks evaluation into layers, from Chinese medical knowledge and multimodal medical understanding to interpretable diagnosis, live clinical cases, physician workflows, and medical education, so models reveal their weaknesses on tasks closer to the clinic."
        summary_zh: "医疗 AI 不能只看聊天流畅度。这条线把评测拆成中文医学知识、多模态医学理解、可解释诊断、实时临床、医生工作流和医学教育几层，让模型在更接近临床的任务上暴露短板。"
        page: "/projects/medical-evaluation-benchmarks/"
        highlights: ["CMB", "GMAI-MMBench", "DxBench", "LiveClin", "DotaBench"]
        image: "/assets/img/media-roundup-2026/cmb-overview.png"
        image_alt: "CMB comprehensive Chinese medical benchmark overview"
        image_alt_zh: "CMB 中文医学综合评测概览"
        papers:
          - title: "CMB: A Comprehensive Medical Benchmark in Chinese"
            url: "https://arxiv.org/abs/2308.08833"
            note: "A comprehensive Chinese medical benchmark."
            note_zh: "中文医学综合 benchmark。"
          - title: "GMAI-MMBench"
            url: "https://arxiv.org/abs/2408.03361"
            note: "Multimodal evaluation for general medical AI."
            note_zh: "面向通用医疗 AI 的多模态评测。"
          - title: "Chain-of-Diagnosis / DxBench"
            url: "https://arxiv.org/abs/2407.13301"
            note: "An interpretable diagnosis model and a diagnosis benchmark built from real doctor-patient dialogues."
            note_zh: "可解释诊断模型和真实医患对话诊断评测。"
          - title: "LiveClin: A Live Clinical Benchmark without Leakage"
            url: "https://arxiv.org/abs/2602.16747"
            note: "A continuously updated, leakage-resistant clinical benchmark."
            note_zh: "持续更新、抗泄漏的真实临床 benchmark。"
          - title: "Enabling Doctor-Centric Medical AI with LLMs through Workflow-Aligned Tasks and Benchmarks"
            url: "https://arxiv.org/abs/2510.11040"
            note: "DoctorFLAN and DotaBench, built around physician workflows."
            note_zh: "DoctorFLAN / DotaBench，面向医生工作流。"
        resources:
          - {type: "GitHub", name: "FreedomIntelligence/CMB", url: "https://github.com/FreedomIntelligence/CMB", note: "Chinese medical benchmark code.", note_zh: "中文医学 benchmark 代码。"}
          - {type: "GitHub", name: "uni-medical/GMAI-MMBench", url: "https://github.com/uni-medical/GMAI-MMBench", note: "GMAI-MMBench multimodal evaluation code.", note_zh: "GMAI-MMBench 多模态评测代码。"}
          - {type: "GitHub", name: "FreedomIntelligence/Chain-of-Diagnosis", url: "https://github.com/FreedomIntelligence/Chain-of-Diagnosis", note: "One entry point for CoD, DxBench, and DiagnosisGPT.", note_zh: "CoD、DxBench、DiagnosisGPT 统一入口。"}
          - {type: "GitHub", name: "AQ-MedAI/LiveClin", url: "https://github.com/AQ-MedAI/LiveClin", note: "LiveClin code and data.", note_zh: "LiveClin 代码和数据入口。"}
          - {type: "GitHub", name: "FreedomIntelligence/DotaGPT", url: "https://github.com/FreedomIntelligence/DotaGPT", note: "Training and evaluation code for DoctorFLAN and DotaBench.", note_zh: "DoctorFLAN / DotaBench 训练与评测代码。"}

      - id: interpretable-llms
        title: "LLM Interpretability"
        title_zh: "大模型可解释性"
        short: "Interpretability"
        short_zh: "可解释性"
        icon: microscope
        kicker: "Explainable and verifiable LLMs"
        kicker_zh: "可解释、可验证的大模型"
        summary: "Interpretability is a cross-cutting capability: why a model answers the way it does, which internal features actually matter, and how mechanistic understanding becomes controllable editing. The line centers on sparse autoencoders, model unlearning, and circuit analysis, and connects to diagnostic chains in medicine, verifiers, and code-integrated reasoning."
        summary_zh: "可解释性是横向能力：它关心模型为什么这样回答、哪些内部特征真正有用、以及如何把机制理解转成可控编辑。这个方向现在以稀疏自编码器（SAE）、模型遗忘和电路分析为主线，同时连接医学诊断链、verifier 和代码集成推理。"
        page: "/projects/llm-interpretability/"
        links:
          - {label: "ICLR 2026 paper", label_zh: "ICLR 2026 论文", url: "https://arxiv.org/abs/2510.03659"}
        highlights: ["Sparse autoencoders", "SAE unlearning", "Circuit analysis", "Chain of Diagnosis"]
        highlights_zh: ["稀疏自编码器", "SAE 遗忘", "电路分析", "Chain of Diagnosis"]
        image: "/assets/img/freedomai-2026/impact/llm-interpretability.svg"
        image_alt: "LLM interpretability and sparse autoencoder analysis"
        image_alt_zh: "大模型可解释性与稀疏自编码器分析"
        papers:
          - title: "Does Higher Interpretability Imply Better Utility? A Pairwise Analysis on Sparse Autoencoders"
            url: "https://arxiv.org/abs/2510.03659"
            venue: "ICLR 2026"
            note: "Compares SAE interpretability metrics with actual steering utility; Outstanding Paper Award at the NeurIPS 2025 ResponsibleFM Workshop."
            note_zh: "系统比较 SAE 的可解释性指标和实际 steering utility；获 NeurIPS 2025 ResponsibleFM Workshop Outstanding Paper Award。"
          - title: "Model Unlearning via Sparse Autoencoder Subspace Guided Projections"
            url: "https://arxiv.org/abs/2505.24428"
            venue: "EMNLP 2025"
            note: "More controllable unlearning through SAE subspace-guided projections."
            note_zh: "用 SAE 子空间引导投影做更可控的模型遗忘。"
          - title: "Towards Understanding Fine-Tuning Mechanisms of LLMs via Circuit Analysis"
            url: "https://arxiv.org/abs/2502.11812"
            venue: "ICML 2025"
            note: "Uses circuit analysis to understand how fine-tuning changes a model's internal computation."
            note_zh: "用电路分析理解微调如何改变模型内部计算。"
          - title: "CoD, Towards an Interpretable Medical Agent using Chain of Diagnosis"
            url: "https://arxiv.org/abs/2407.13301"
            note: "A five-step diagnostic chain with confidence distributions makes medical diagnosis interpretable."
            note_zh: "用五步诊断链和置信度分布提升医学诊断可解释性。"
          - title: "Outcome-supervised Verifiers for Planning in Mathematical Reasoning"
            url: "https://arxiv.org/abs/2311.09724"
            note: "Outcome-supervised verifiers that guide planning in math reasoning."
            note_zh: "用结果监督 verifier 辅助数学规划推理。"
          - title: "CoRT: Code-integrated Reasoning within Thinking"
            url: "https://arxiv.org/abs/2506.09820"
            note: "Code execution inside the thinking process makes intermediate computation transparent."
            note_zh: "把代码执行放入思维过程，让中间计算更透明。"
        resources:
          - {type: "Project", name: "LLM Interpretability and Sparse Autoencoders", url: "/projects/llm-interpretability/", note: "SAE utility, SAE-guided unlearning, and circuit analysis.", note_zh: "SAE utility、SAE 引导的模型遗忘和电路分析详情页。"}
          - {type: "Paper", venue: "ICLR 2026", name: "Does Higher Interpretability Imply Better Utility?", url: "https://arxiv.org/abs/2510.03659", note: "Pairwise analysis on sparse autoencoders.", note_zh: "稀疏自编码器的成对分析。"}
          - {type: "Paper", venue: "EMNLP 2025", name: "Model Unlearning via SAE Subspace Guided Projections", url: "https://arxiv.org/abs/2505.24428", note: "Unlearning guided by interpretable subspaces.", note_zh: "可解释子空间引导的模型遗忘。"}
          - {type: "Paper", venue: "ICML 2025", name: "Fine-Tuning Mechanisms via Circuit Analysis", url: "https://arxiv.org/abs/2502.11812", note: "Understanding LLM fine-tuning through circuit analysis.", note_zh: "用电路分析理解大模型微调机制。"}
          - {type: "GitHub", name: "FreedomIntelligence/Chain-of-Diagnosis", url: "https://github.com/FreedomIntelligence/Chain-of-Diagnosis", note: "CoD code, diagnostic-chain data, disease database, DxBench, and DiagnosisGPT.", note_zh: "CoD 代码、诊断链数据、疾病库、DxBench 和 DiagnosisGPT 入口。"}
          - {type: "HF Model", name: "FreedomIntelligence/DiagnosisGPT-6B", url: "https://huggingface.co/FreedomIntelligence/DiagnosisGPT-6B", note: "Interpretable diagnosis model built on CoD.", note_zh: "基于 CoD 的可解释诊断模型。"}
          - {type: "HF Dataset", name: "FreedomIntelligence/DxBench", url: "https://huggingface.co/datasets/FreedomIntelligence/DxBench", note: "Diagnosis benchmark built from real doctor-patient dialogues.", note_zh: "真实医患对话构建的疾病诊断 benchmark。"}
          - {type: "GitHub", name: "FreedomIntelligence/OVM", url: "https://github.com/FreedomIntelligence/OVM", note: "Code for outcome-supervised verifiers.", note_zh: "结果监督 verifier 相关代码。"}
          - {type: "GitHub", name: "ChengpengLi1003/CoRT", url: "https://github.com/ChengpengLi1003/CoRT", note: "Code-integrated reasoning.", note_zh: "代码集成推理项目。"}
          - {type: "GitHub", name: "tulerfeng/Video-R1", url: "https://github.com/tulerfeng/Video-R1", note: "Reinforcement learning code for video reasoning.", note_zh: "视频推理强化学习代码。"}
