    topics:

      - id: general-llm-evaluation
        title: "General LLM Evaluation"
        title_zh: "通用大模型评估"
        short: "General Evaluation"
        short_zh: "通用评估"
        icon: list-checks
        kicker: "Rubrics, judges, freshness, bias, ethics, and rewards"
        kicker_zh: "Rubric、评审模型、时效性、偏差、伦理与奖励"
        summary: "Rubric-based evaluation and reward design meet trustworthy, responsible AI evaluation in one line of general evaluation: from per-sample criteria, LLM-as-a-judge bias, temporal generalization, and cultural bias, to medical ethics and rubric-to-reward, turning open-ended evaluation into feedback that is auditable, reproducible, and trainable."
        summary_zh: "这个方向把 Rubric-based Evaluation & Reward Design 和 Trustworthy / Responsible AI Evaluation 合并成一条更大的“通用评估”主线：从 per-sample criteria、LLM-as-a-judge 偏差、时间泛化、文化偏差，到医疗伦理和 rubric-to-reward，把开放式能力评测变成可审计、可复现、可训练的反馈系统。"
        page: "/projects/general-llm-evaluation/"
        links:
          - {label: "Awesome-Rubrics", label_zh: "Awesome-Rubrics", url: "https://github.com/FreedomIntelligence/Awesome-Rubrics"}
          - {label: "MLLM-Bench", label_zh: "MLLM-Bench", url: "https://github.com/FreedomIntelligence/MLLM-Bench"}
