  - id: physical-ai
    name: "Physical AI"
    name_zh: "物理 AI"
    icon: cuboid
    tagline: "Connecting foundation models with spatial environments, robots, and real-world interaction."
    tagline_zh: "连接基础模型、空间环境、机器人与真实世界交互。"
    topics:

      - id: roomhub
        title: "RoomHub: From Video to Interactive Worlds"
        title_zh: "RoomHub：从视频到可交互的世界"
        short: "RoomHub"
        short_zh: "RoomHub"
        icon: sofa
        kicker: "Reconstructed environments to act in, test, and learn from"
        kicker_zh: "可以行动、试验与学习的重建环境"
        summary: "Video records how the world looks, and it also leaves clues about object structure and motion. RoomHub explores how to turn visual reconstruction into editable, operable, and verifiable 3D environments, connecting reconstruction, agent assembly, and interaction testing so reconstructed worlds can support gameplay, embodied learning, and repeatable experiments."
        summary_zh: "视频记录了世界的外观，也留下了物体结构与运动方式的线索。RoomHub 探索如何利用这些线索，把视觉重建转化为可编辑、可操作、可验证的 3D 环境，连接视觉重建、智能体装配与交互测试，让重建出来的世界能够承载游戏玩法、具身学习和可重复的实验。"
        links:
          - {label: "Open RoomHub", label_zh: "打开 RoomHub", url: "/RoomHub/"}
          - {label: "Try the interactive demos", label_zh: "体验交互演示", url: "/RoomHub/#scenes"}
        highlights: ["Video to 3D", "Movable parts", "Agent assembly", "Execution checks"]
        highlights_zh: ["视频转 3D", "可动部件", "智能体装配", "执行验证"]
        image: "/RoomHub/assets/sv-office/poster.jpg"
        image_alt: "RoomHub interactive demo: a reconstructed garden study with cabinets that can be opened"
        image_alt_zh: "RoomHub 交互演示：可以打开柜门的重建庭院书房"
        list_title: "Research pipeline"
        list_title_zh: "研究路线"
        steps:
          - title: "Recover structure"
            title_zh: "恢复结构"
            note: "Estimate geometry, camera poses, and object structure from observations, separating appearance from editable geometry."
            note_zh: "从观测估计几何、相机位姿与物体结构，连接视觉外观和可编辑的几何表示。"
          - title: "Build behavior"
            title_zh: "构建行为"
            note: "Let an agent identify movable parts and assign joints, motion limits, collision geometry, and physical parameters."
            note_zh: "让智能体识别活动部件，设置关节、运动范围、碰撞几何与物理参数。"
          - title: "Execute and refine"
            title_zh: "执行与修正"
            note: "Run interactions in the environment, inspect the outcomes, and use failures to guide the next edit."
            note_zh: "在环境中执行交互、观察结果，以失败案例指导下一轮修改。"
          - title: "Where it stands"
            title_zh: "当前进展"
            note: "Browser demos compare interactive video for cabinet doors, drawers, and articulated parts; the full pipeline is under development."
            note_zh: "可在浏览器中操作的交互视频对比，覆盖柜门、抽屉及关节部件；完整流程仍在研究与开发中。"
        resources:
          - {type: "Project", name: "RoomHub", url: "/RoomHub/", note: "Research site with two interactive scenes: a garden study and an island kitchen.", note_zh: "研究主页与两个交互场景：庭院书房与中岛厨房。"}

