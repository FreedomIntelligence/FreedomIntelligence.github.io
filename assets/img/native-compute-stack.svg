<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
  <title id="title">China-developed AI compute adaptation stack</title>
  <desc id="desc">A layered diagram connecting production workloads, inference systems, kernel optimization, and heterogeneous AI accelerators.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081a31"/><stop offset="1" stop-color="#103f59"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39d5ff"/><stop offset="1" stop-color="#68f0b0"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1440" height="810" rx="36" fill="url(#bg)"/>
  <circle cx="1280" cy="105" r="250" fill="#24a9d8" opacity=".08"/>
  <circle cx="120" cy="760" r="300" fill="#62e7ae" opacity=".06"/>
  <text x="90" y="105" fill="#8ae8ff" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">AI FOR COMPUTING</text>
  <text x="90" y="165" fill="white" font-family="Arial, sans-serif" font-size="44" font-weight="700">AI Compute Adaptation &amp; Acceleration</text>
  <text x="90" y="208" fill="#bad2df" font-family="Arial, sans-serif" font-size="23">From model migration to reproducible accelerator benchmarks</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(90 270)"><rect width="1260" height="95" rx="20" fill="#153d59" stroke="#4b8098"/><text x="40" y="40" fill="#7fe7ff" font-size="18" font-weight="700">REAL-WORLD DELIVERY</text><text x="40" y="70" fill="white" font-size="25">Clinical agents · Local model services · Secure system integration</text></g>
    <g transform="translate(150 400)"><rect width="1140" height="95" rx="20" fill="#174d5b" stroke="#51a8a4"/><text x="40" y="40" fill="#79f1d0" font-size="18" font-weight="700">INFERENCE SYSTEMS</text><text x="40" y="70" fill="white" font-size="25">vLLM · SGLang · KV Cache · FlashAttention · FlashInfer</text></g>
    <g transform="translate(210 530)"><rect width="1020" height="95" rx="20" fill="#1d5754" stroke="#63c9a5"/><text x="40" y="40" fill="#98f3be" font-size="18" font-weight="700">OPERATORS AND KERNELS</text><text x="40" y="70" fill="white" font-size="25">Profiling · Graph tuning · Operator fusion · Kernel optimization</text></g>
    <g transform="translate(270 660)"><rect width="900" height="80" rx="20" fill="url(#accent)"/><text x="450" y="50" fill="#082437" text-anchor="middle" font-size="25" font-weight="700">ASCEND · NVIDIA · AMD · TPU · APPLE SILICON</text></g>
  </g>
  <path d="M720 365v35M720 495v35M720 625v35" stroke="#6feccb" stroke-width="5" stroke-linecap="round"/>
</svg>
